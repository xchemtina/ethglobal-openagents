[project]
name = "chimiaclaw-rdkit-smiles-to-moladt"
version = "0.1.0"
description = "RDKit-backed SMILES \u2192 MolADT JSON worker for ChimiaClaw."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ChimiaDAO" },
]
license = { text = "Apache-2.0 OR MIT" }
dependencies = [
  "rdkit>=2024.3.0",
]

[project.scripts]
rdkit-smiles-to-moladt = "chimiaclaw_rdkit.cli:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimiaclaw_rdkit"]
