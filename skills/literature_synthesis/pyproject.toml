[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "literature-synthesis"
version = "0.1.0"
description = "ChimiaClaw Literature lane: open-access ingestion + deterministic citation-grounded extraction → signed science.literature.synthesis artifacts."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ChimiaDAO", email = "info@chimiadao.io" }]
license = { text = "Apache-2.0" }

dependencies = [
  "click>=8.1",
  "pydantic>=2.9",
  "blake3>=0.4",
  "orjson>=3.10",
]

[project.optional-dependencies]
ingest = [
  "chimia-kb",
  "httpx>=0.27",
  "tenacity>=9.1",
]
extract = [
  "mlx-vlm>=0.5; platform_system == 'Darwin'",
  "pypdf>=4.0",
]
fallback = [
  "openai>=1.40",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
full = ["literature-synthesis[ingest,extract,fallback,dev]"]

[project.scripts]
literature-synthesis = "literature_synthesis.cli:main"

[tool.uv]
# The `chimia-kb` source tree lives outside this repo and is reused as-is.
# Install with: uv pip install -e ../../skills/literature_synthesis -e ~/Documents/ChimiaDAO-PaperIngestion
# The path-source below makes `uv sync` discover it automatically.
[tool.uv.sources]
chimia-kb = { path = "/Users/crischimiadao/Documents/ChimiaDAO-PaperIngestion", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/literature_synthesis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
