[project]
name = "chimiaclaw-askcos-retro"
version = "0.1.0"
description = "ASKCOS retrosynthesis template-relevance client for ChimiaClaw."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ChimiaDAO" },
]
license = { text = "Apache-2.0 OR MIT" }
dependencies = [
  "httpx>=0.27.0",
]

[project.scripts]
askcos-retro = "chimiaclaw_askcos.cli:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimiaclaw_askcos"]
