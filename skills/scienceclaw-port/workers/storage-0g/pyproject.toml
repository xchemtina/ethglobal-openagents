[project]
name = "chimiaclaw-zerog-uploader"
version = "0.1.0"
description = "0G Storage upload wrapper for ChimiaClaw."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ChimiaDAO" },
]
license = { text = "Apache-2.0 OR MIT" }
dependencies = []

[project.scripts]
zerog-upload = "chimiaclaw_zerog.cli:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimiaclaw_zerog"]
