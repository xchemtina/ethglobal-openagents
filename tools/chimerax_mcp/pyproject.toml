[project]
name = "chimerax-mcp"
version = "0.1.0"
description = "MCP server for UCSF ChimeraX — open structures, run commands, snapshots."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
chimerax-mcp = "chimerax_mcp.server:main"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimerax_mcp"]
