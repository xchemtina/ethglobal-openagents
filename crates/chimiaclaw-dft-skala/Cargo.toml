[package]
name = "chimiaclaw-dft-skala"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
live = ["dep:base64", "dep:sha2"]

[dependencies]
base64 = { version = "0.22", optional = true }
chimiaclaw-artifact = { path = "../chimiaclaw-artifact" }
chimiaclaw-moladt = { path = "../chimiaclaw-moladt" }
chimiaclaw-schema = { path = "../chimiaclaw-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }

[lints]
workspace = true
