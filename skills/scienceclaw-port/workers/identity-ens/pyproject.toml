[project]
name = "chimiaclaw-ens-publisher"
version = "0.1.0"
description = "ENS text-record publisher for ChimiaClaw (write-side companion to chimiaclaw-identity-ens)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ChimiaDAO" },
]
license = { text = "Apache-2.0 OR MIT" }
dependencies = [
  "web3>=7.0",
  "eth-account>=0.13",
]

[project.scripts]
ens-publish-text-records = "chimiaclaw_ens.cli:main"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimiaclaw_ens"]
