[package]
name = "chimiaclaw-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
live-sponsors = [
  "dep:chimiaclaw-dft-skala",
  "dep:chimiaclaw-exec-keeperhub",
  "dep:chimiaclaw-identity-ens",
  "dep:chimiaclaw-storage-0g",
  "chimiaclaw-dft-skala/live",
  "chimiaclaw-exec-keeperhub/live",
  "chimiaclaw-identity-ens/live",
  "chimiaclaw-storage-0g/live",
]

[dependencies]
chimiaclaw-artifact = { path = "../chimiaclaw-artifact" }
chimiaclaw-crucible = { path = "../chimiaclaw-crucible" }
chimiaclaw-dft-skala = { path = "../chimiaclaw-dft-skala", optional = true }
chimiaclaw-exec-keeperhub = { path = "../chimiaclaw-exec-keeperhub", optional = true }
chimiaclaw-governance = { path = "../chimiaclaw-governance" }
chimiaclaw-identity-ens = { path = "../chimiaclaw-identity-ens", optional = true }
chimiaclaw-market = { path = "../chimiaclaw-market" }
chimiaclaw-moladt = { path = "../chimiaclaw-moladt" }
chimiaclaw-node = { path = "../chimiaclaw-node" }
chimiaclaw-ord-adt = { path = "../chimiaclaw-ord-adt" }
chimiaclaw-schema = { path = "../chimiaclaw-schema" }
chimiaclaw-storage-0g = { path = "../chimiaclaw-storage-0g", optional = true }
retroquoter = { path = "../../apps/retroquoter" }
serde_json = "1"

[lints]
workspace = true
