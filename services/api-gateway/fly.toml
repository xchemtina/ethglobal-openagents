# fly launch --config services/api-gateway/fly.toml
# Then: fly secrets set X402_MODE=stub REVOLUT_PAY_TO=... etc.

app = "chimiaclaw-api-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 4021
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
